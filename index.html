<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yhazrin 手绘图标</title><style>*{box-sizing:border-box}body{margin:0;padding:64px 8vw;background:#f5f6f8;color:#292c32;font:16px/1.6 system-ui,sans-serif}h1{font-size:32px;margin:0 0 8px}p{color:#6c727b}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-top:40px}a{display:flex;flex-direction:column;gap:16px;align-items:center;text-decoration:none;color:inherit;background:white;border-radius:24px;padding:32px 16px}img{width:80px;height:80px;transition:transform 240ms cubic-bezier(.2,.8,.2,1)}a:hover img{transform:translateY(-6px) rotate(-5deg)}a:focus-visible{outline:3px solid #459dca;outline-offset:4px}small{color:#757a82}@media(prefers-reduced-motion:reduce){img{transition:none}a:hover img{transform:none}}</style><h1>手绘图标</h1><p>来自 Yhazrin 创作桌面的 8 个 SVG。点击查看原文件。</p><main><a href="icons/orbit.svg"><img src="icons/orbit.svg" alt="飞碟"><span>飞碟</span><small>orbit</small></a><a href="icons/mail.svg"><img src="icons/mail.svg" alt="信封"><span>信封</span><small>mail</small></a><a href="icons/orb.svg"><img src="icons/orb.svg" alt="轨道球"><span>轨道球</span><small>orb</small></a><a href="icons/eye.svg"><img src="icons/eye.svg" alt="眼睛"><span>眼睛</span><small>eye</small></a><a href="icons/folder.svg"><img src="icons/folder.svg" alt="文件夹"><span>文件夹</span><small>folder</small></a><a href="icons/printer.svg"><img src="icons/printer.svg" alt="打印机"><span>打印机</span><small>printer</small></a><a href="icons/gear.svg"><img src="icons/gear.svg" alt="设置"><span>设置</span><small>gear</small></a><a href="icons/basket.svg"><img src="icons/basket.svg" alt="收纳筐"><span>收纳筐</span><small>basket</small></a></main></html>
